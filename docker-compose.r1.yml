services:
  apache_with_php:
    build:
      context: .
      dockerfile: Dockerfile.r1
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    volumes:
      - ./src:/var/www/html/
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started

  mysql:
    image: ${DB_IMAGE:-mariadb:11.4}
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comment-sidecar
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: comment-sidecar
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 2s
      timeout: 2s
      retries: 30

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
